name: Publish blog issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-blog-issues
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.actor == 'yangjunx21' &&
      github.event.issue.user.login == 'yangjunx21' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Prepare article
        run: python3 scripts/publish_blog_issue.py "$GITHUB_EVENT_PATH"
      - name: Commit article
        id: commit
        shell: bash
        run: |
          git add _posts/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish blog issue #${{ github.event.issue.number }}"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Build GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
